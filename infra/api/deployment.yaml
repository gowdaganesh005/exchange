apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: exchange
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: api-deployment
    app.kubernetes.io/component: backend
  spec:
    replicas: 1
    selector:
      matchLabels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: api-deployment
    template:
      metadata:
        labels:
          app.kubernetes.io/name: api
          app.kubernetes.io/instance: api
          app.kubernetes.io/component: backend
          
      spec:
        containers:
          - name: api-app
            image: exchange-api:latest
            ports:
              - containerPort: 3000





